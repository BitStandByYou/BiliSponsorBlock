name: 发布安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要发布的版本标签，例如 v1.0.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: bilisb-release.p12
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 检查标签版本
        run: |
          tag_version="${RELEASE_TAG#v}"
          module_version="$(sed -n 's/^[[:space:]]*val MODULE_VERSION_NAME = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ -z "$module_version" ] || [ "$tag_version" != "$module_version" ]; then
            echo "标签版本 $tag_version 与模块版本 $module_version 不一致。"
            exit 1
          fi

      - name: 解码发布签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo '缺少发布签名 Secrets，请参考 .agents/skills/github-release/SKILL.md。'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

      - name: 构建已签名 APK
        run: ./gradlew :app:assembleRelease

      - name: 准备 Release 附件
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/BiliSponsorBlock-${RELEASE_TAG}.apk"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 哔哩哔哩空降助手 ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/BiliSponsorBlock-${{ env.RELEASE_TAG }}.apk
